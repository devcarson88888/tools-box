<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to Useful Tools Box." />
    <title>Log in — Useful Tools Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell auth-shell">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="https://devcarson88888.github.io/tools-box/#top" aria-label="Useful Tools Box home"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>tools<span class="brand-dot">.</span>box</span></a>
        <a class="auth-home-link" href="https://devcarson88888.github.io/tools-box/">← <span data-i18n="backHome">Back to home</span></a>
      </nav>
      <main class="auth-main">
        <section class="auth-card" aria-labelledby="login-title">
          <div class="eyebrow"><span class="eyebrow-dot"></span> <span data-i18n="welcomeBack">Welcome back</span></div>
          <h1 id="login-title" data-i18n="loginTitle">Log in to<br /><em>your toolbox.</em></h1>
          <p class="auth-intro" data-i18n="loginIntro">Pick up where you left off and get back to the tools that help you do your best work.</p>
          <form class="auth-form" data-auth-form="login" action="#" method="post">
            <label for="login-email" data-i18n="emailLabel">Email address</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            <label for="login-password" data-i18n="passwordLabel">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
            <div class="auth-options"><label class="checkbox-label"><input type="checkbox" name="remember" /> <span data-i18n="remember">Remember me</span></label><a href="#forgot" id="forgot-password" data-i18n="forgot">Forgot password?</a></div>
            <button class="button button-dark auth-submit" type="submit" data-i18n="loginButton">Log in</button>
            <p class="form-feedback" aria-live="polite"></p>
          </form>
          <p class="auth-switch"><span data-i18n="noAccount">Don't have an account?</span> <a href="signup.html" data-i18n="signup">Sign up</a></p>
        </section>
        <aside class="auth-art" aria-hidden="true"><span class="auth-star">✳</span><strong>small tools.<br /><em>big help.</em></strong><span class="auth-orbit"></span></aside>
      </main>
      <footer class="footer"><span>© 2026 tools.box</span><span data-i18n="privateNote">Simple tools, made with care.</span></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
