<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Switch your Useful Tools Box account." />
    <title>Switch account — Useful Tools Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page-shell auth-shell">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="/tools-box/#top" aria-label="Useful Tools Box home"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>tools<span class="brand-dot">.</span>box</span></a>
        <a class="auth-home-link" href="/tools-box/">← <span data-i18n="backHome">Back to home</span></a>
      </nav>
      <main class="auth-main switch-main">
        <section class="auth-card" aria-labelledby="switch-title">
          <div class="eyebrow"><span class="eyebrow-dot"></span> <span data-i18n="accountSettings">Account settings</span></div>
          <h1 id="switch-title" data-i18n="switchTitle">Switch<br /><em>your account.</em></h1>
          <p class="auth-intro" data-i18n="switchIntro">You are currently signed in as:</p>
          <p class="switch-current"><span class="account-avatar" id="switch-avatar" aria-hidden="true">U</span><strong id="switch-email">Loading account…</strong></p>
          <button class="button button-dark auth-submit" id="switch-confirm" type="button" data-i18n="switchButton">Continue with another account</button>
          <button class="button cancel-auth-button" id="cancel-signout" type="button" data-i18n="signOutButton">Cancel sign in</button>
          <p class="auth-switch"><a href="/tools-box/" data-i18n="staySignedIn">Stay signed in</a></p>
        </section>
        <aside class="auth-art auth-art-peach" aria-hidden="true"><span class="auth-star">✳</span><strong>one box.<br /><em>many ways.</em></strong><span class="auth-orbit"></span></aside>
      </main>
      <footer class="footer"><span>© 2026 tools.box</span><span data-i18n="privateNote">Simple tools, made with care.</span></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script.js?v=20260914-auth"></script>
    <script>
      const switchEmail = document.querySelector("#switch-email");
      const switchAvatar = document.querySelector("#switch-avatar");
      if (window.supabaseClient) {
        window.supabaseClient.auth.getUser().then(({ data }) => {
          const user = data.user;
          if (!user?.email) {
            window.location.href = new URL("../login/", window.location.href).href;
            return;
          }
          switchEmail.textContent = window.maskEmail ? window.maskEmail(user.email) : user.email;
          switchAvatar.textContent = (user.user_metadata?.name || user.email).trim().charAt(0).toUpperCase();
        });
      }
    </script>
  </body>
</html>
