<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert length, mass, temperature, and volume units with Useful Tools Box." />
    <title>Unit converter — Useful Tools Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles.css?v=20261005-more-tools" />
    <link rel="stylesheet" href="../tools.css?v=20261005-more-tools" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="../../#top" aria-label="Useful Tools Box home"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>tools<span class="brand-dot">.</span>box</span></a>
        <a class="auth-home-link" href="../../search/">← Back to tools</a>
      </nav>
      <main class="standalone-tool">
        <a class="back-link" href="../../#tools">← All tools</a>
        <header class="tool-heading">
          <div class="eyebrow"><span class="eyebrow-dot"></span> Everyday tool · calculated in your browser</div>
          <h1>Unit <em>converter.</em></h1>
          <p>Convert common length, weight, temperature, and volume measurements with clear, instant results.</p>
        </header>
        <section class="tool-workspace" aria-label="Unit converter">
          <div class="tool-controls">
            <label class="tool-control-group" for="unit-category">
              <span class="tool-label">Measurement</span>
              <select id="unit-category">
                <option value="length">Length</option>
                <option value="mass">Weight</option>
                <option value="temperature">Temperature</option>
                <option value="volume">Volume</option>
              </select>
            </label>
          </div>
          <div class="tool-columns">
            <div class="tool-panel">
              <label class="tool-field-label" for="unit-value">Value</label>
              <input id="unit-value" type="number" step="any" value="1" />
              <label class="tool-field-label" for="unit-from" style="margin-top: 16px;">From</label>
              <select id="unit-from"></select>
            </div>
            <div class="tool-panel">
              <label class="tool-field-label" for="unit-to">To</label>
              <select id="unit-to"></select>
              <div class="tool-toolbar"><button class="tool-button tool-button-primary" id="convert-units" type="button">Convert <span aria-hidden="true">↗</span></button></div>
              <output class="unit-result" id="unit-result" aria-live="polite">1 m = 1 m</output>
            </div>
          </div>
          <p class="tool-status" id="unit-status" role="status" aria-live="polite"></p>
        </section>
      </main>
      <footer class="footer"><a class="brand" href="../../"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>tools<span class="brand-dot">.</span>box</span></a><span>© 2026 tools.box</span></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../script.js?v=20261005-more-tools"></script>
    <script src="app.js?v=20261005-more-tools"></script>
  </body>
</html>
