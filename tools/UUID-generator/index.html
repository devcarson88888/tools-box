<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate secure UUID v4 identifiers locally with Useful Tools Box." />
    <title>UUID generator — Useful Tools Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles.css?v=20261005-more-tools" />
    <link rel="stylesheet" href="../tools.css?v=20261005-more-tools" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="../../#top" aria-label="Useful Tools Box home"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>tools<span class="brand-dot">.</span>box</span></a>
        <a class="auth-home-link" href="../../search/">← Back to tools</a>
      </nav>
      <main class="standalone-tool">
        <a class="back-link" href="../../#tools">← All tools</a>
        <header class="tool-heading">
          <div class="eyebrow"><span class="eyebrow-dot"></span> Developer tool · generated in your browser</div>
          <h1>UUID <em>generator.</em></h1>
          <p>Generate cryptographically strong UUID v4 identifiers locally. Choose how many you need, then copy or download them.</p>
        </header>
        <section class="tool-workspace" aria-label="UUID generator">
          <div class="tool-controls">
            <label class="tool-control-group" for="uuid-count">
              <span class="tool-label">Number of UUIDs</span>
              <input id="uuid-count" type="number" min="1" max="100" value="5" />
            </label>
            <button class="tool-button tool-button-primary" id="generate-uuids" type="button">Generate UUIDs <span aria-hidden="true">↗</span></button>
          </div>
          <label class="tool-field-label" for="uuid-output">Generated UUIDs</label>
          <textarea class="tool-textarea" id="uuid-output" readonly spellcheck="false" placeholder="Your UUIDs will appear here, one per line."></textarea>
          <div class="tool-toolbar">
            <button class="tool-button" id="copy-uuids" type="button" disabled>Copy UUIDs</button>
            <button class="tool-button" id="download-uuids" type="button" disabled>Download .txt</button>
            <button class="tool-button" id="clear-uuids" type="button">Clear</button>
          </div>
          <p class="tool-status" id="uuid-status" role="status" aria-live="polite">Generate up to 100 UUIDs at a time.</p>
        </section>
      </main>
      <footer class="footer"><a class="brand" href="../../"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>tools<span class="brand-dot">.</span>box</span></a><span>© 2026 tools.box</span></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../script.js?v=20261005-more-tools"></script>
    <script src="app.js?v=20261005-more-tools"></script>
  </body>
</html>
